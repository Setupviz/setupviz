name: Checks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node --test scripts/tests/*.test.mjs
      - name: Browser behavior, accessibility and layout checks
        if: success() || failure()
        run: |
          status=0
          for check in og-image nav contrast scroll monitors landmarks skeleton axe cls safeguards swap; do
            node scripts/verify/$check.mjs || status=1
          done
          exit "$status"
  first-paint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify/paint.mjs
  python-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover tests -v
        working-directory: api
