<script>
document.getElementById('skip').onclick = function(){ localStorage.removeItem('sv-grip'); };
var saved = localStorage.getItem('sv-grip');
document.querySelectorAll('input[type="radio"]').forEach(function(input){
  input.checked = input.value === saved;
  input.addEventListener('change', function(){ localStorage.setItem('sv-grip', input.value); });
});
</script>
