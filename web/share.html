<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SetupViz — See your desk setup to scale before you buy</title>
<meta name="description" content="Enter your desk and hand size. Get a keyboard, mouse, pad and monitor that fit, shown on your desk to scale.">
<link rel="canonical" href="https://setupviz.com/share.html">
<meta property="og:title" content="SetupViz — See your desk setup to scale before you buy">
<meta property="og:description" content="Enter your desk and hand size. Get a keyboard, mouse, pad and monitor that fit, shown on your desk to scale.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://setupviz.com/share.html">
<meta property="og:site_name" content="SetupViz">
<meta property="og:image" content="https://setupviz.com/og-desk.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="SetupViz — See your desk setup to scale before you buy">
<meta name="twitter:description" content="Enter your desk and hand size. Get a keyboard, mouse, pad and monitor that fit, shown on your desk to scale.">
<meta name="twitter:image" content="https://setupviz.com/og-desk.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="sv.css">
<style>
body{margin:0;background:#121212;color:#EDEDED;font-family:var(--font)}
a{color:#EDEDED;text-decoration:none}a:hover{color:#FFFFFF}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:40px 16px;box-sizing:border-box}
.card{width:100%;max-width:1200px;box-sizing:border-box;padding:40px;border-radius:20px;background:#171717;border:0;display:flex;flex-wrap:wrap;gap:36px}
.left{flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:12px}
.right{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:10px;justify-content:center}
.muted{font-size:13px;color:#8F8F8F}
#desk{position:relative;width:100%;aspect-ratio:2/1;border-radius:14px;background:#141414;border:1px solid rgba(255,255,255,0.08);background-image:radial-gradient(rgba(255,255,255,0.09) 1px,transparent 1.2px);background-size:16px 16px;background-position:8px 8px;overflow:hidden}
.left > .muted:first-child{min-height:24px}
.p{position:absolute;box-sizing:border-box}
.p-keyboard{border-radius:8px;background-color:#262626;background-image:linear-gradient(90deg,#171717 1px,transparent 1px),linear-gradient(#171717 1px,transparent 1px);background-size:12px 12px;border:1px solid rgba(255,255,255,0.18)}
.p-pad{border-radius:12px;background:#161616;border:1px solid rgba(255,255,255,0.12)}
.p-pad.glass{background:linear-gradient(135deg,#222222 0%,#181818 55%,#202020 100%);border-color:rgba(255,255,255,0.26)}
.p-mouse{border-radius:40% 40% 45% 45%;background:#EDEDED}
.p-monitor{display:flex;flex-direction:column;align-items:center}
.p-monitor .scr{width:100%;height:14%;border-radius:4px;background:#2A2A2A;border:1px solid rgba(255,255,255,0.25);box-sizing:border-box;display:flex;align-items:flex-end;overflow:hidden}
.p-monitor .scr i{width:100%;height:45%;background:#EDEDED}
.p-monitor .neck{width:5%;background:#3A3A3A}
.p-monitor .base{border-radius:50%/70%;background:#1A1A1A;border:1px solid rgba(255,255,255,0.16);box-sizing:border-box}
h1{margin:0 0 8px;font-size:34px;line-height:1.1;font-weight:400;letter-spacing:-0.03em;min-height:2.2em}
#items{min-height:326px} /* four parts at the 24px body line, held until data.js fills them */
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:#1C1C1C;border:0}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{height:40px;min-height:24px;padding:0 18px;display:inline-flex;align-items:center;border-radius:999px;font-size:14px;font-weight:400;cursor:pointer;border:0;font-family:inherit}
.btn-primary{background:#EDEDED;color:#121212}.btn-primary:hover{color:#121212;background:#FFFFFF}
.btn-outline{background:#1C1C1C;border:1px solid rgba(255,255,255,0.08);color:#EDEDED}.btn-outline:hover{background:#232323;color:#EDEDED}
@media (max-width:640px){.card{padding:20px;gap:24px}h1{font-size:26px}}
@media (pointer:coarse){.btn{min-height:44px;min-width:44px;height:44px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="card">
    <div class="left">
      <div class="muted" style="display:flex;justify-content:space-between"><span id="deskLine"></span><span id="used"></span></div>
      <div id="desk" role="img"></div>
      <div class="muted" style="display:flex;align-items:center;justify-content:space-between">
        <span style="display:flex;align-items:center;gap:8px;color:#EDEDED;font-weight:600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4" stroke="#EDEDED" stroke-width="2"></rect><rect x="6" y="12" width="8" height="3" rx="1.5" fill="#EDEDED"></rect><rect x="16" y="11" width="2.5" height="4" rx="1.25" fill="#8F8F8F"></rect></svg>SetupViz</span>
        <span>Built and checked on SetupViz</span>
      </div>
    </div>
    <div class="right">
      <h1><span id="title"></span><br><span style="color:#8F8F8F" id="sub"></span></h1>
      <div id="items" style="display:flex;flex-direction:column;gap:10px"></div>
    </div>
  </div>
  <div class="acts">
    <button type="button" class="btn btn-primary" id="copy">Copy link</button>
    <a class="btn btn-outline" id="open" href="builder.html">Open in the builder</a>
    <a class="btn btn-outline" href="desk.html">Build my own</a>
  </div>
</main>

<script src="data.js"></script>
<script>
(function(){
  var unit = localStorage.getItem('sv-unit') || 'in';
  function num(mm){ var v = unit === 'in' ? mm/25.4 : mm/10; var s = v.toFixed(1); return s.endsWith('.0') ? s.slice(0,-2) : s; }
  function one(mm){ return num(mm) + ' ' + unit; }
  function two(a,b){ return num(a) + ' × ' + num(b) + ' ' + unit; }
  function pct(v,t){ return (v/t*100).toFixed(2) + '%'; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // the setup comes from the link; with no link, show this browser's own setup
  var link = location.search.match(/[?&]s=([^&#]+)/), data = link && SV.decode(link[1]);
  if (!data) {
    var desk = { w: 1400, d: 700 }, a = SV.answers(), saved = null;
    try { var sd = JSON.parse(localStorage.getItem('sv-desk') || 'null'); if (sd && sd.w > 300 && sd.d > 200) desk = sd; saved = JSON.parse(localStorage.getItem('sv-setup') || 'null'); } catch (e) {}
    if (saved && saved.sig !== [desk.w, desk.d, a.grip, a.hand, a.use].join('|')) saved = null;
    var pick = saved && saved.pick || SV.recommend(a, desk), pos = saved && saved.pos || SV.layout(desk, pick);
    data = { setup: { desk: desk, pick: pick, pos: pos }, answers: a };
  }
  var S = data.setup, A = data.answers, code = SV.encode(S, A);
  var on = ['pad', 'monitor', 'keyboard', 'mouse'].filter(function(c){ return S.pick[c] && SV.get(c, S.pick[c]); });
  var st = SV.check(S, one), colors = ['#5BE38A', '#F5C542', '#FF6B5B'];

  var deskEl = document.getElementById('desk');
  deskEl.style.aspectRatio = S.desk.w + ' / ' + S.desk.d;
  on.forEach(function(c){
    var s = SV.get(c, S.pick[c]), p = S.pos[c], el = document.createElement('div');
    el.className = 'p p-' + c + (s.kind === 'glass' ? ' glass' : '');
    el.style.left = pct(p.x, S.desk.w); el.style.top = pct(p.y, S.desk.d); el.style.width = pct(s.w, S.desk.w); el.style.height = pct(s.d, S.desk.d);
    if (c === 'monitor') { var bh = s.base[1]/s.d*100; el.innerHTML = '<div class="scr"><i></i></div><div class="neck" style="height:' + Math.max(0, 86 - bh) + '%"></div><div class="base" style="width:' + pct(s.base[0], s.w) + ';height:' + bh + '%"></div>'; }
    deskEl.appendChild(el);
  });
  var names = on.map(function(c){ return SV.get(c, S.pick[c]).name; });
  deskEl.setAttribute('aria-label', 'Desk from above with ' + (names.length ? names.join(', ') : 'nothing on it yet'));

  var area = 0;
  on.forEach(function(c){ var s = SV.get(c, S.pick[c]); if (c === 'monitor') area += s.base[0]*s.base[1]; else if (c !== 'mouse') area += s.w*s.d; });
  if (S.pick.keyboard && S.pick.pad && on.indexOf('keyboard') >= 0 && on.indexOf('pad') >= 0) {
    var k = SV.get('keyboard', S.pick.keyboard), pd = SV.get('pad', S.pick.pad);
    area -= SV.overlap({ x: S.pos.keyboard.x, y: S.pos.keyboard.y, w: k.w, d: k.d }, { x: S.pos.pad.x, y: S.pos.pad.y, w: pd.w, d: pd.d });
  }
  document.getElementById('deskLine').textContent = 'Desk · ' + two(S.desk.w, S.desk.d);
  document.getElementById('used').textContent = Math.round(area/(S.desk.w*S.desk.d)*100) + '% used';

  var fits = on.filter(function(c){ return st[c].lvl === 0; }).length, tight = on.filter(function(c){ return st[c].lvl === 1; }).length, bad = on.length - fits - tight;
  var title = !on.length ? 'An empty desk.' : fits === on.length ? on.length + ' of ' + on.length + ' fit.' : [fits ? fits + ' fit' : '', tight ? tight + ' tight' : '', bad ? bad + " won't fit" : ''].filter(Boolean).join(', ') + '.';
  document.getElementById('title').textContent = title;
  var at = SV.answerText(A);
  document.getElementById('sub').textContent = at ? at.charAt(0).toUpperCase() + at.slice(1).replace(/ · /g, ', ') + '.' : 'Checked to scale.';
  document.getElementById('items').innerHTML = ['monitor', 'keyboard', 'mouse', 'pad'].filter(function(c){ return on.indexOf(c) >= 0; }).map(function(c){
    var s = SV.get(c, S.pick[c]);
    var dims = c === 'monitor' ? 'Stand ' + two(s.base[0], s.base[1]) : two(s.w, s.d) + (s.g ? ' · ' + s.g + ' g' : '') + (s.kind ? ' · ' + SV.padLabels[s.kind].toLowerCase() : '');
    return '<div class="item"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:500">' + esc(s.name) + '</span><span style="font-size:12px;color:#8F8F8F">' + dims + '</span></div><span class="dot" style="background:' + colors[st[c].lvl] + '" title="' + ['Fits', 'Tight', "Won't fit"][st[c].lvl] + '"></span></div>';
  }).join('');

  var url = new URL('share.html?s=' + code, location.href).href;
  document.getElementById('open').href = 'builder.html?s=' + code;
  document.getElementById('copy').onclick = function(){
    var b = this;
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(function(){ b.textContent = 'Link copied'; setTimeout(function(){ b.textContent = 'Copy link'; }, 1800); });
  };
})();
</script>
<p class="sv-disclosure">As an Amazon Associate I earn from qualifying purchases.</p>
</body>
</html>
