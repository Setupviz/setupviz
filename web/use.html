<body>
<nav class="sv-nav" aria-label="Main"><div class="sv-nav-in">
  <a href="/home" class="sv-brand"><img src="/setupviz-logo.png" width="26" height="26" alt="">SetupViz</a>
  <div class="sv-links">
    <a class="l" href="/home#story" aria-label="How it works"><span class="nav-full">How it works</span></a>
    <a class="l" href="/home#checks" aria-label="Checks we run"><span class="nav-full">Checks we run</span></a>
    <a class="l" href="/builder" aria-label="Builder">Builder</a>
  </div>
  <a class="pill pill-light pill-sm nav-cta" href="/desk" aria-label="Find my setup"><span class="nav-full">Find my setup</span></a>
</div></nav>
<div class="wrap">
  <header class="hdr">
    <a href="/home" class="btn btn-outline">Close</a>
  </header>
  <div class="prog">
    <div class="bars" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div>
    <div class="meta"><span>Use</span><span>4 of 4</span></div>
  </div>
  <main>
    <div style="display:flex;flex-direction:column;gap:10px">
      <h1>What is the setup for?</h1>
      <p class="lead">Choose what you do most at this desk.</p>
    </div>
    <div class="opts" role="radiogroup" aria-label="Main use">
      <label class="opt"><span style="flex:1;display:flex;flex-direction:column;gap:3px"><span class="t">Gaming</span><span class="d">Room for fast, wide mouse swings comes first.</span></span><input type="radio" name="use" value="gaming"></label>
      <label class="opt"><span style="flex:1;display:flex;flex-direction:column;gap:3px"><span class="t">Work</span><span class="d">Screen space and a number pad matter more.</span></span><input type="radio" name="use" value="work"></label>
      <label class="opt"><span style="flex:1;display:flex;flex-direction:column;gap:3px"><span class="t">Both</span><span class="d">I use this desk for work and gaming.</span></span><input type="radio" name="use" value="both"></label>
    </div>
  </main>
  <footer>
    <a href="/grip" class="btn btn-ghost" style="padding:0 12px">Back</a>
    <div style="display:flex;gap:8px">
      <a href="/builder" class="btn btn-ghost" style="padding:0 14px" id="skip">Skip</a>
      <a href="/builder" class="btn btn-primary">Continue</a>
    </div>
    <div style="flex:1 0 100%;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-top:8px"><a href="/privacy" class="sv-legal-link">Privacy</a><a href="/terms" class="sv-legal-link">Terms</a><a href="/disclosure" class="sv-legal-link">Affiliate disclosure</a></div>
  </footer>
</div>
<script>
document.getElementById('skip').onclick = function(){ localStorage.removeItem('sv-use'); };
var saved = localStorage.getItem('sv-use');
document.querySelectorAll('input[type="radio"]').forEach(function(input){
  input.checked = input.value === saved;
  input.addEventListener('change', function(){ localStorage.setItem('sv-use', input.value); });
});
</script>
<p class="sv-disclosure">As an Amazon Associate I earn from qualifying purchases.</p>
